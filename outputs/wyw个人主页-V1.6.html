<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="王悦为 Lia wil · 智能医学工程（脑机接口方向）大一学生 · 红黑白 谋杀案海报风" />
  <title>王悦为 · WIL</title>

  <!-- 纯自定义样式，无外部依赖，彻底离线自包含 -->
  <style>
    :root {
      --ink: #000000;        /* 纯黑 */
      --red: #d40b1c;        /* 海报高纯红 */
      --red-deep: #9c0b15;   /* 深红 */
      --white: #ffffff;      /* 纯白 */
      --off: #f3efe6;        /* 米白（正文用） */
      --gray: #c9c6bd;       /* 灰白 */
      --font: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif;
      --disp: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", Arial, sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --wrap: 78rem;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 4.4rem; }
    body { margin: 0; background: var(--ink); color: var(--off); font-family: var(--font); line-height: 1.75; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    ::selection { background: var(--red); color: #fff; }
    a { color: inherit; text-decoration: none; }
    button { font-family: var(--font); }
    h1,h2,h3,p { margin: 0; }
    .wrap { width: min(100% - clamp(1.2rem, 6vw, 4rem) * 2, var(--wrap)); margin-inline: auto; }

    /* ---------------- 顶部栏 ---------------- */
    .topbar { position: sticky; top: 0; z-index: 80; background: var(--ink); border-bottom: 2px solid var(--red); }
    .topbar__inner { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: 0.8rem; }
    .brand { display: inline-flex; align-items: center; gap: 0.55rem; font-weight: 900; letter-spacing: 0.06em; }
    .brand svg { width: 1.5rem; height: 1.5rem; color: var(--red); }
    .brand b { color: var(--white); }
    .brand .sub { font-size: 0.66rem; letter-spacing: 0.26em; color: var(--gray); font-weight: 700; }
    .topnav { display: flex; align-items: center; gap: clamp(0.8rem, 3vw, 1.6rem); }
    .topnav a { font-size: 0.82rem; letter-spacing: 0.14em; color: var(--off); opacity: 0.78; font-weight: 700; transition: color .3s var(--ease), opacity .3s var(--ease); }
    .topnav a:hover { color: var(--red); opacity: 1; }
    .lang { display: inline-flex; padding: 0.16rem; border: 1px solid #444; border-radius: 2px; }
    .lang button { padding: 0.24rem 0.62rem; border: 0; background: transparent; color: var(--off); font-size: 0.72rem; font-weight: 800; letter-spacing: .06em; cursor: pointer; transition: all .3s var(--ease); }
    .lang button.is-active { background: var(--red); color: #fff; }

    /* ---------------- 色带 ---------------- */
    .band { position: relative; overflow: hidden; }
    .band--red { background: var(--red); color: var(--ink); }
    .band--black { background: var(--ink); color: var(--white); }
    .grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.14; background-image: radial-gradient(rgba(0,0,0,0.32) 1.2px, transparent 1.4px); background-size: 8px 8px; mix-blend-mode: multiply; }
    .label { display: inline-flex; align-items: center; gap: 0.6rem; font-size: 0.74rem; font-weight: 800; letter-spacing: 0.34em; text-transform: uppercase; }
    .label::before { content: ""; width: 1.6rem; height: 3px; background: currentColor; }
    .band--red .label { color: var(--ink); }
    .band--black .label { color: var(--white); }
    .band--black .label::after { content: ""; width: 1.6rem; height: 3px; background: var(--red); }

    /* ---------------- 封面 ----------------
       上红下黑，标题黑色置于红底区，清晰区分 */
    .cover { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: clamp(3rem, 10vw, 6rem) clamp(1.2rem, 6vw, 4rem); background: linear-gradient(180deg, var(--red) 0%, var(--red) 58%, var(--ink) 58%, var(--ink) 100%); position: relative; }
    .cover__scene { position: absolute; inset: 0; pointer-events: none; }
    .cover__scene svg { position: absolute; }
    .cover__fade { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 40%, rgba(0,0,0,0.16), rgba(0,0,0,0) 60%); pointer-events: none; }
    .cover__inner { position: relative; z-index: 3; }

    .eyebrow { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.5em; text-transform: uppercase; color: var(--white); opacity: 0.95; }
    .cover__name { font-family: var(--disp); font-size: clamp(3rem, 14.5vw, 10rem); font-weight: 900; line-height: 0.9; letter-spacing: 0.16em; color: var(--white); margin-top: 1.6rem; display: inline-block; padding: 0.04em 0.18em; background: var(--ink); clip-path: polygon(1.6% 0, 98.4% 0, 100% 22%, 100% 100%, 0 100%, 0 22%); box-shadow: 0 8px 28px rgba(0,0,0,0.45); }
    .cover__name .ch { display: inline-block; opacity: 0; transform: perspective(800px) rotateY(-92deg); transform-origin: left center; backface-visibility: hidden; animation: chIn 0.9s var(--ease) forwards; }
    .cover__name .en { letter-spacing: 0.34em; color: var(--white); text-shadow: 0 0 2px var(--red); }
    .cover__rule { display: flex; align-items: center; justify-content: center; gap: 0.7rem; margin: 1.6rem auto 0; }
    .cover__rule i { width: 3.4rem; height: 4px; background: var(--white); display: inline-block; }
    .cover__role { font-family: var(--disp); font-size: clamp(0.95rem, 2.4vw, 1.15rem); font-weight: 700; letter-spacing: 0.16em; color: var(--white); margin-top: 1.2rem; }
    .cover__intro { max-width: 40rem; margin: 1.2rem auto 0; font-size: clamp(1rem, 2.2vw, 1.16rem); color: rgba(255,255,255,0.95); }
    .cover__intro strong { color: #fff; background: var(--red); padding: 0 0.3rem; }
    .cover__cta { display: inline-flex; align-items: center; gap: 0.6rem; margin-top: 2.2rem; padding: 0.85rem 2rem; background: var(--ink); color: #fff; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; font-size: 0.88rem; transition: transform .35s var(--ease), background .35s var(--ease), color .35s var(--ease); animation: pulseBox 2.6s var(--ease) infinite; }
    .cover__cta:hover { background: #fff; color: var(--red); transform: translateY(-3px); }

    .scroll-hint { position: absolute; z-index: 3; bottom: 1.5rem; left: 50%; transform: translateX(-50%); font-size: 0.62rem; font-weight: 800; letter-spacing: 0.34em; text-transform: uppercase; color: var(--gray); display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
    .scroll-hint::after { content: ""; width: 2px; height: 1.8rem; background: linear-gradient(var(--gray), transparent); margin-top: 0.1rem; }

    /* ---------------- 章节 ---------------- */
    .section { padding-block: clamp(3.2rem, 9vw, 6rem); position: relative; }
    .section__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1.2rem; flex-wrap: wrap; margin-bottom: clamp(1.8rem, 4vw, 2.8rem); position: relative; }
    .h2 { font-family: var(--disp); font-size: clamp(2rem, 6.5vw, 4rem); font-weight: 900; letter-spacing: 0.04em; line-height: 1.05; margin-top: 0.8rem; }
    .band--red .h2 { color: var(--ink); }
    .band--black .h2 { color: var(--white); }
    .h2 .hl { color: #fff; background: var(--red); padding: 0.02em 0.14em; }
    .band--red .h2 .hl { color: var(--red); background: var(--ink); }
    .section__sub { max-width: 30rem; color: var(--gray); font-size: 0.96rem; }
    .band--red .section__sub { color: rgba(0,0,0,0.72); }

    /* ---------------- 关于（黑） ---------------- */
    .about-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(1rem, 3vw, 2rem); align-items: stretch; position: relative; }
    .long-intro { font-size: clamp(1.15rem, 3vw, 1.6rem); line-height: 1.6; color: var(--off); font-weight: 500; }
    .long-intro em { font-style: normal; color: #fff; background: var(--red); padding: 0 0.22em; }
    .about-meta { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1.6rem; }
    .chip { padding: 0.28rem 0.68rem; border: 1px solid #444; color: var(--gray); font-size: 0.8rem; font-weight: 700; }
    .chip b { color: var(--red); font-weight: 800; }
    .fact-card { background: var(--red); color: #fff; padding: clamp(1.4rem, 3.5vw, 2.2rem); position: relative; overflow: hidden; }
    .fact-card::after { content: ""; position: absolute; right: -3rem; bottom: -3rem; width: 9rem; height: 9rem; background: var(--ink); transform: rotate(45deg); opacity: 0.94; }
    .fact-card__title { position: relative; z-index: 1; display: inline-flex; align-items: baseline; gap: 0.6rem; font-weight: 900; letter-spacing: 0.2em; font-size: 1rem; color: #fff; }
    .fact-card__title i { font-style: normal; color: var(--ink); font-size: 1.1rem; }
    .fact-list { position: relative; z-index: 1; display: flex; flex-direction: column; margin-top: 1rem; }
    .fact-row { display: flex; justify-content: space-between; gap: 1rem; padding-block: 0.72rem; border-bottom: 1px solid rgba(255,255,255,0.3); }
    .fact-row:last-child { border-bottom: 0; }
    .fact-row dt { color: rgba(255,255,255,0.78); font-size: 0.82rem; flex-shrink: 0; }
    .fact-row dd { margin: 0; font-weight: 800; text-align: right; font-size: 0.92rem; }

    /* ---------------- 专业+爱好 图标带（红/黑 均鲜艳） ---------------- */
    .motif-strip { display: flex; align-items: center; justify-content: center; gap: clamp(1rem, 4vw, 3rem); flex-wrap: wrap; margin-bottom: clamp(2rem, 5vw, 3.2rem); }
    .seam { position: relative; height: clamp(2.4rem, 7vw, 4.2rem); overflow: hidden; background: var(--ink); border-top: 3px solid var(--red); border-bottom: 3px solid var(--red); }
    .seam::before, .seam::after { content: ""; position: absolute; top: 0; bottom: 0; width: 50%; background: var(--red); }
    .seam::before { left: 0; clip-path: polygon(0 0, 100% 0, 100% 100%, 18% 100%, 34% 58%, 22% 46%, 40% 26%, 28% 14% ); }
    .seam::after { right: 0; clip-path: polygon(0 0, 100% 0, 100% 100%, 82% 100%, 66% 58%, 78% 46%, 60% 26%, 72% 14% ); }
    .seam .zig { position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 34%; background: var(--ink); clip-path: polygon(50% 0, 68% 34%, 52% 56%, 70% 100%, 30% 100%, 48% 56%, 32% 34%); }
    .seam .dot { position: absolute; width: 9px; height: 9px; background: var(--ink); border-radius: 50%; top: 50%; }
    .seam .dot.d1 { left: 12%; transform: translateY(-50%); }
    .seam .dot.d2 { right: 12%; transform: translateY(-50%); }
    .motif { display: inline-flex; flex-direction: column; align-items: center; gap: 0.5rem; opacity: 0.92; }
    .motif svg { width: clamp(1.9rem, 3.6vw, 2.6rem); height: clamp(1.9rem, 3.6vw, 2.6rem); color: currentColor; }
    .motif span { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
    .band--black .motif { color: var(--white); }
    .band--black .motif span { color: var(--gray); }
    .band--red .motif { color: var(--ink); }
    .band--red .motif span { color: rgba(0,0,0,0.62); }

    /* ---------------- 兴趣（红） ---------------- */
    .hobbies { display: grid; grid-template-columns: repeat(5, 1fr); gap: clamp(0.8rem, 2vw, 1.3rem); }
    .hobby { position: relative; background: var(--ink); color: #fff; padding: clamp(1.1rem, 2.6vw, 2rem) 1rem; text-align: left; border: 0; cursor: pointer; display: flex; flex-direction: column; gap: 1rem; transition: transform .35s var(--ease), background .35s var(--ease), color .35s var(--ease); }
    .hobby:hover { transform: translateY(-6px); background: #fff; color: var(--ink); }
    .hobby svg { width: clamp(2rem, 4vw, 3rem); height: clamp(2rem, 4vw, 3rem); color: var(--red); }
    .hobby .cn { font-weight: 900; font-size: clamp(1.1rem, 2.4vw, 1.5rem); }
    .hobby .en { font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gray); font-weight: 800; }
    .hobby::before { content: ""; position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: var(--red); }

    /* ---------------- 项目（黑） ---------------- */
    .growing { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(1rem, 3vw, 2rem); }
    .grow-card { border: 1px solid #333; padding: clamp(1.4rem, 3.5vw, 2.2rem); position: relative; transition: border-color .35s var(--ease), transform .35s var(--ease), background .35s var(--ease); }
    .grow-card:hover { border-color: var(--red); transform: translateY(-6px); background: rgba(212,11,28,0.06); }
    .grow-card__no { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.3em; color: var(--gray); }
    .grow-card h3 { margin: 0.7rem 0 0.5rem; font-size: clamp(1.2rem, 2.6vw, 1.5rem); font-weight: 900; color: #fff; }
    .grow-card p { color: var(--gray); font-size: 0.94rem; }
    .grow-badge { display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 1rem; color: var(--red); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
    .grow-badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: pulse 2s var(--ease) infinite; }

    /* ---------------- 联系方式（合并大板块） ---------------- */
    .contact-panel { background: var(--ink); color: #fff; border: 2px solid var(--red); padding: clamp(1.6rem, 4vw, 3rem); position: relative; overflow: hidden; }
    .contact-panel::before { content: ""; position: absolute; top: 0; right: 0; width: 6rem; height: 6rem; background: var(--red); clip-path: polygon(100% 0, 0 0, 100% 100%); }
    .contact-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.8rem; position: relative; z-index: 1; }
    .contact-head h3 { font-family: var(--disp); font-size: clamp(1.7rem, 4.5vw, 2.8rem); font-weight: 900; letter-spacing: 0.04em; }
    .contact-head h3 .hl { color: var(--red); background: #fff; padding: 0 0.14em; }
    .contact-head p { color: var(--gray); font-size: 0.92rem; max-width: 22rem; }
    .contact-list { position: relative; z-index: 1; display: flex; flex-direction: column; }
    .contact-line { display: flex; align-items: center; gap: clamp(0.8rem, 2vw, 1.4rem); padding-block: clamp(1rem, 2.6vw, 1.6rem); border-top: 1px solid #2b2b2b; transition: background .3s var(--ease), padding-left .3s var(--ease); }
    .contact-line:last-child { border-bottom: 1px solid #2b2b2b; }
    .contact-line:hover { background: rgba(212,11,28,0.1); padding-left: 1rem; }
    .contact-badge { display: inline-flex; align-items: center; gap: 0.5rem; width: clamp(6.5rem, 18vw, 10rem); flex-shrink: 0; }
    .contact-badge svg { width: 1.4rem; height: 1.4rem; color: var(--ink); flex-shrink: 0; background: #fff; border-radius: 50%; padding: 0.22rem; box-sizing: content-box; }
    .contact-badge b { font-size: 0.78rem; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; color: var(--white); background: var(--red); padding: 0.14rem 0.5rem; border-radius: 2px; }
    .contact-line__v { font-weight: 900; font-size: clamp(1.05rem, 2.8vw, 1.5rem); letter-spacing: 0.02em; word-break: break-all; flex: 1; }
    .contact-line__tap { flex-shrink: 0; font-size: 0.8rem; color: var(--gray); display: inline-flex; align-items: center; gap: 0.4rem; }
    .contact-line__tap::after { content: "→"; color: var(--red); transition: transform .3s var(--ease); }
    .contact-line:hover .contact-line__tap::after { transform: translateX(4px); }

    /* ---------------- 页脚 ---------------- */
    .footer { background: var(--ink); border-top: 2px solid var(--red); padding-block: clamp(1.8rem, 4vw, 2.6rem); }
    .footer__inner { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .footer p { color: var(--gray); font-size: 0.86rem; }
    .footer .mono { font-size: 0.7rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--red); }
    .footer b { color: #fff; }

    /* ---------------- 动效 ---------------- */
    [data-reveal] { opacity: 0; transform: translateY(24px); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }
    [data-reveal].is-in { opacity: 1; transform: none; }
    .mask-in { display: inline-block; position: relative; overflow: hidden; vertical-align: bottom; }
    .mask-in > span { display: inline-block; transform: translateY(110%); transition: transform 0.9s var(--ease); }
    .is-in .mask-in > span, [data-reveal].is-in .mask-in > span { transform: translateY(0); }
    @keyframes chIn { from { opacity: 0; transform: perspective(800px) rotateY(-92deg); } to { opacity: 1; transform: perspective(800px) rotateY(0); } }
    @keyframes pulseBox { 0%,100% { box-shadow: 0 0 0 0 rgba(212,11,28,0.55); } 50% { box-shadow: 0 0 0 12px rgba(212,11,28,0); } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } }
    @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes rain { 0% { transform: translateY(-10%); opacity: 0; } 12% { opacity: 1; } 100% { transform: translateY(110vh); opacity: 0; } }
    @keyframes dash { to { stroke-dashoffset: 0; } }
    .fall { position: absolute; width: 10px; height: 10px; background: #fff; opacity: 0; animation: rain linear infinite; }
    .fall.r { background: var(--red); }
    .fall.k { background: #26261f; }
    .art-float { animation: floatY 6s var(--ease) infinite; }
    .brain-pulse { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite; }

    /* ---------------- 响应式 ---------------- */
    @media (max-width: 900px) {
      .topnav > a { display: none; }
      .about-grid { grid-template-columns: 1fr; }
      .hobbies { grid-template-columns: repeat(2, 1fr); }
      .growing { grid-template-columns: 1fr; }
      .contact-line { flex-wrap: wrap; }
      .contact-badge { width: 100%; }
    }
    @media (max-width: 480px) { .hobbies { grid-template-columns: 1fr; } .cover__name { letter-spacing: 0.08em; } }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      [data-reveal], .mask-in > span, .cover__name .ch, .fall, .art-float, .cover__cta, .grow-badge i, .brain-pulse { animation: none !important; transition: none !important; }
      [data-reveal] { opacity: 1; transform: none; }
      .cover__name .ch { opacity: 1; transform: none; }
      .mask-in > span { transform: none; }
    }
  </style>
</head>

<body>
  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="#top">
        <svg viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><path d="M38 40 L46 12 L66 36 Z"/><path d="M62 40 L54 12 L34 36 Z"/><circle cx="50" cy="56" r="24"/><ellipse cx="43" cy="54" rx="3" ry="5" fill="#fff"/><ellipse cx="57" cy="54" rx="3" ry="5" fill="#fff"/></svg>
        <b id="brand-name">王悦为</b><span class="sub">WIL · LIA</span>
      </a>
      <nav class="topnav" aria-label="导航">
        <a id="nav-about" href="#about">关于</a>
        <a id="nav-growing" href="#growing">项目</a>
        <a id="nav-hobbies" href="#hobbies">兴趣</a>
        <a id="nav-contact" href="#contact">联系</a>
        <div class="lang" role="group" aria-label="语言切换">
          <button type="button" data-lang="zh" class="is-active">中</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <!-- 封面：上红下黑 + 剪影场景 -->
    <section class="cover" id="top">
      <div class="cover__scene" aria-hidden="true">
        <!-- 黑色庄园剪影 + 成排红窗（顶端） -->
        <svg viewBox="0 0 1200 460" preserveAspectRatio="xMidYMax meet" style="top:0;left:0;width:100%;z-index:1;">
          <g fill="#000">
            <path d="M0 460 L0 120 L120 40 L240 120 L240 460 Z"/>
            <rect x="200" y="80" width="150" height="380"/>
            <path d="M200 80 L275 10 L350 80 Z"/>
            <rect x="470" y="60" width="120" height="400"/>
            <path d="M470 60 L530 0 L590 60 Z"/>
            <rect x="620" y="60" width="26" height="400"/>
            <rect x="740" y="120" width="180" height="340"/>
            <path d="M740 120 L830 50 L920 120 Z"/>
            <rect x="1040" y="90" width="90" height="370"/>
            <path d="M1040 90 L1085 30 L1130 90 Z"/>
            <!-- 烟囱 -->
            <rect x="300" y="30" width="26" height="90"/><rect x="880" y="55" width="22" height="70"/>
          </g>
          <g fill="#d40b1c">
            <rect x="40" y="150" width="22" height="52"/><rect x="88" y="150" width="22" height="52"/>
            <rect x="40" y="230" width="22" height="52"/><rect x="88" y="230" width="22" height="52"/>
            <rect x="40" y="310" width="22" height="52"/><rect x="88" y="310" width="22" height="52"/>
            <rect x="40" y="390" width="22" height="52"/><rect x="88" y="390" width="22" height="52"/>
            <rect x="225" y="120" width="26" height="46"/><rect x="277" y="120" width="26" height="46"/>
            <rect x="225" y="200" width="26" height="46"/><rect x="277" y="200" width="26" height="46"/>
            <rect x="225" y="280" width="26" height="46"/><rect x="277" y="280" width="26" height="46"/>
            <rect x="225" y="360" width="26" height="46"/><rect x="277" y="360" width="26" height="46"/>

      $("#about-meta").innerHTML = t.aboutMeta.map((m, i) => `<span class="chip"><b>${String(i + 1).padStart(2, "0")}</b>${m}</span>`).join("");
      $("#fact-title").textContent = t.factTitle;
      $("#fact-list").innerHTML = t.facts.map((f) => `<div class="fact-row"><dt>${f.k}</dt><dd>${f.v}</dd></div>`).join("");

      $("#hobbies-tag").textContent = t.hobbiesTag;
      $("#hobbies-h2").innerHTML = buildH2(t.hobbiesH2a, t.hobbiesH2b, "");
      $("#hobbies-sub").textContent = t.hobbiesSub;
      $("#hobbies").innerHTML = t.hobbies.map((h) => `
        <button class="hobby" type="button" data-reveal>
          ${ICON[h.icon]}
          <span class="en">${h.en}</span>
          <span class="cn">${h.cn}</span>
        </button>`).join("");

      $("#growing-tag").textContent = t.growingTag;
      $("#growing-h2").innerHTML = buildH2(t.growingH2a, t.growingH2b, "");
      $("#growing-sub").textContent = t.growingSub;
      $("#growing").innerHTML = t.growing.map((g) => `
        <article class="grow-card" data-reveal>
          <div class="grow-card__no">CASE ${g.no}</div>
          <h3>${g.title}</h3>
          <p>${g.desc}</p>
          <span class="grow-badge"><i></i>${g.badge}</span>
        </article>`).join("");

      $("#contact-tag").textContent = t.contactTag;
      $("#contact-h2").innerHTML = buildH2(t.contactH2a, t.contactH2b, "");
      $("#contact-sub").textContent = t.contactSub;
      $("#contact-title").textContent = t.contactTitle;
      $("#contact-hl").textContent = t.contactHl;
      $("#contact-note").textContent = t.contactNote;
      $("#contact").innerHTML = t.contact.map((c) => `
        <a class="contact-line" href="${c.href}" target="${c.href.startsWith("http") ? "_blank" : "_self"}">
          <span class="contact-badge">${BADGE[c.badge]}<b>${c.type}</b></span>
          <span class="contact-line__v">${c.v}</span>
          <span class="contact-line__tap">${c.tap}</span>
        </a>`).join("");

      $("#footer").textContent = t.footer;
      $("#footer-note").textContent = t.footerNote;

      document.querySelectorAll(".lang button").forEach((b) => b.classList.toggle("is-active", b.dataset.lang === lang));
      observe();
    }

    /* ---------- 滚动浮现 ---------- */
    let io = null;
    function observe() {
      if (io) io.disconnect();
      io = new IntersectionObserver((es) => {
        es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("is-in"); io.unobserve(e.target); } });
      }, { threshold: 0.14 });
      document.querySelectorAll("[data-reveal]").forEach((el) => io.observe(el));
    }

    function bindLang() {
      document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
        if (b.dataset.lang !== lang) { lang = b.dataset.lang; render(); }
      }));
    }

    function init() {
      render();
      bindLang();
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  })();
  </script>
</body>
</html>
