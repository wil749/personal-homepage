<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="一名热爱 AI 与编程的学生的个人品牌主页" />
  <title>个人主页｜AI 编程学生</title>
  <style>
    :root {
      /* 颜色系统：V2 阶段可从这里统一换肤 */
      --color-bg: #f6f7f9;
      --color-surface: #ffffff;
      --color-text: #17191d;
      --color-text-muted: #626871;
      --color-primary: #3758f9;
      --color-primary-hover: #2947d7;
      --color-border: #e3e6eb;
      --color-tag-bg: #edf0ff;
      --color-tag-text: #2947d7;
      --color-shadow: rgba(23, 25, 29, 0.08);

      /* 字体系统 */
      --font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      --font-size-sm: 0.875rem;
      --font-size-base: 1rem;
      --font-size-lg: 1.125rem;
      --font-size-xl: clamp(1.65rem, 5vw, 2.6rem);
      --line-height: 1.7;

      /* 间距系统 */
      --space-1: 0.5rem;
      --space-2: 0.75rem;
      --space-3: 1rem;
      --space-4: 1.5rem;
      --space-5: 2rem;
      --space-6: 3rem;
      --space-7: 5rem;

      /* 形状与布局 */
      --radius-sm: 0.65rem;
      --radius-md: 1rem;
      --radius-round: 999px;
      --container-width: 68rem;
      --transition: 180ms ease;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      line-height: var(--line-height);
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--color-primary) 35%, transparent);
      outline-offset: 3px;
    }

    .container {
      width: min(calc(100% - (var(--space-4) * 2)), var(--container-width));
      margin-inline: auto;
    }

    .hero {
      display: grid;
      min-height: 68vh;
      place-items: center;
      padding-block: var(--space-7);
      text-align: center;
    }

    .hero__content {
      max-width: 44rem;
    }

    .avatar {
      display: grid;
      width: 7rem;
      height: 7rem;
      margin: 0 auto var(--space-4);
      place-items: center;
      border: 4px solid var(--color-surface);
      border-radius: 50%;
      background: var(--color-primary);
      box-shadow: 0 0.8rem 2rem var(--color-shadow);
      color: var(--color-surface);
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      user-select: none;
    }

    .eyebrow {
      margin: 0 0 var(--space-1);
      color: var(--color-primary);
      font-size: var(--font-size-sm);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: var(--space-3);
      font-size: var(--font-size-xl);
      line-height: 1.2;
    }

    h2 {
      margin-bottom: var(--space-4);
      font-size: clamp(1.4rem, 4vw, 2rem);
      line-height: 1.3;
    }

    .intro {
      margin-bottom: var(--space-5);
      color: var(--color-text-muted);
      font-size: var(--font-size-lg);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.9rem;
      padding: var(--space-2) var(--space-4);
      border: 1px solid transparent;
      border-radius: var(--radius-round);
      background: var(--color-primary);
      color: var(--color-surface);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      transition: background var(--transition), transform var(--transition);
    }

    .button:hover {
      background: var(--color-primary-hover);
      transform: translateY(-2px);
    }

    .section {
      padding-block: var(--space-6);
    }

    .section__heading {
      max-width: 38rem;
      margin-bottom: var(--space-5);
    }

    .section__heading p {
      margin-bottom: 0;
      color: var(--color-text-muted);
    }

    .tag-list,
    .social-list {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tag {
      display: inline-flex;
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-round);
      background: var(--color-tag-bg);
      color: var(--color-tag-text);
      font-size: var(--font-size-sm);
      font-weight: 700;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-4);
    }

    .project-card {
      display: flex;
      min-height: 17rem;
      flex-direction: column;
      padding: var(--space-4);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      box-shadow: 0 0.6rem 1.8rem var(--color-shadow);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 1rem 2.2rem var(--color-shadow);
    }

    .project-card__index {
      color: var(--color-primary);
      font-size: var(--font-size-sm);
      font-weight: 800;
    }

    .project-card h3 {
      margin-block: var(--space-3) var(--space-2);
      font-size: 1.25rem;
    }

    .project-card p {
      flex: 1;
      color: var(--color-text-muted);
    }

    .project-card .button {
      align-self: flex-start;
      background: transparent;
      border-color: var(--color-border);
      color: var(--color-text);
    }

    .project-card .button:hover {
      background: var(--color-tag-bg);
      color: var(--color-primary-hover);
    }

    .footer {
      margin-top: var(--space-6);
      padding-block: var(--space-5);
      border-top: 1px solid var(--color-border);
    }

    .footer__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
    }

    .footer p {
      margin: 0;
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
    }

    .social-link {
      color: var(--color-text);
      font-weight: 700;
      text-decoration: none;
    }

    .social-link:hover {
      color: var(--color-primary);
      text-decoration: underline;
    }

    @media (max-width: 760px) {
      .hero {
        min-height: auto;
        padding-block: var(--space-6);
      }

      .project-grid {
        grid-template-columns: 1fr;
      }

      .footer__inner {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="container hero__content">
      <div id="avatar" class="avatar" role="img" aria-label="个人头像"></div>
      <p id="eyebrow" class="eyebrow"></p>
      <h1 id="name"></h1>
      <p id="intro" class="intro"></p>
      <a class="button" href="#projects" data-action="scroll-projects">查看我的作品</a>
    </div>
  </header>

  <main>
    <section class="section" aria-labelledby="skills-title">
      <div class="container">
        <div class="section__heading">
          <h2 id="skills-title">技能标签</h2>
          <p>我正在学习并持续实践的工具与方向。</p>
        </div>
        <ul id="skills" class="tag-list" aria-label="技能列表"></ul>
      </div>
    </section>

    <section id="projects" class="section" aria-labelledby="projects-title">
      <div class="container">
        <div class="section__heading">
          <h2 id="projects-title">项目作品集</h2>
          <p>以下是用于展示的项目占位卡片，你可以直接在 data 中替换内容。</p>
        </div>
        <div id="project-grid" class="project-grid"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p id="copyright"></p>
      <nav aria-label="社交链接">
        <ul id="social-links" class="social-list"></ul>
      </nav>
    </div>
  </footer>

  <script>
    // V1 的所有可编辑内容都集中在这里。
    const data = {
      profile: {
        name: "你的名字",
        initials: "YN",
        role: "AI 编程学生",
        intro: "你好！我是一名热爱 AI 与编程的学生，正在用 Vibe Coding 把灵感变成真实、好用的数字作品。"
      },
      skills: [
        "HTML",
        "CSS",
        "JavaScript",
        "AI 工具",
        "Vibe Coding",
        "UI 设计",
        "持续学习"
      ],
      projects: [
        {
          title: "个人品牌主页",
          description: "一个清晰展示个人介绍、技能和作品的响应式单页网站。",
          buttonText: "查看项目",
          url: "#"
        },
        {
          title: "AI 学习助手",
          description: "使用 AI 整理学习资料、生成复习计划的概念产品。",
          buttonText: "查看项目",
          url: "#"
        },
        {
          title: "灵感收藏夹",
          description: "用于收集网页、文字与设计灵感的轻量级前端工具。",
          buttonText: "查看项目",
          url: "#"
        },
        {
          title: "每日习惯看板",
          description: "帮助记录每日目标与成长进度的可视化页面。",
          buttonText: "查看项目",
          url: "#"
        }
      ],
      socials: [
        { label: "GitHub", url: "https://github.com/" },
        { label: "即刻", url: "https://web.okjike.com/" },
        { label: "邮箱", url: "mailto:hello@example.com" }
      ],
      feedback: {
        projectPlaceholder: "这是 V1 的占位项目。替换 data.projects 中的 url 后即可跳转到真实作品。",
        socialClick: "即将打开社交链接："
      }
    };

    function renderProfile() {
      document.getElementById("avatar").textContent = data.profile.initials;
      document.getElementById("eyebrow").textContent = data.profile.role;
      document.getElementById("name").textContent = data.profile.name;
      document.getElementById("intro").textContent = data.profile.intro;
      document.getElementById("copyright").textContent =
        `© ${new Date().getFullYear()} ${data.profile.name} · 保持好奇，持续创造。`;
    }

    function renderSkills() {
      const skillsContainer = document.getElementById("skills");
      skillsContainer.innerHTML = data.skills
        .map((skill) => `<li><span class="tag">${skill}</span></li>`)
        .join("");
    }

    function renderProjects() {
      const projectGrid = document.getElementById("project-grid");
      projectGrid.innerHTML = data.projects
        .map(
          (project, index) => `
            <article class="project-card">
              <span class="project-card__index">PROJECT ${String(index + 1).padStart(2, "0")}</span>
              <h3>${project.title}</h3>
              <p>${project.description}</p>
              <a
                class="button project-link"
                href="${project.url}"
                data-title="${project.title}"
                aria-label="${project.buttonText}：${project.title}"
              >${project.buttonText}</a>
            </article>
          `
        )
        .join("");
    }

    function renderSocials() {
      const socialContainer = document.getElementById("social-links");
      socialContainer.innerHTML = data.socials
        .map(
          (social) => `
            <li>
              <a class="social-link" href="${social.url}" data-label="${social.label}">${social.label}</a>
            </li>
          `
        )
        .join("");
    }

    function bindInteractions() {
      document.querySelectorAll(".project-link").forEach((link) => {
        link.addEventListener("click", (event) => {
          if (link.getAttribute("href") === "#") {
            event.preventDefault();
            alert(`${link.dataset.title}\n\n${data.feedback.projectPlaceholder}`);
            console.log("项目卡片已点击：", link.dataset.title);
          }
        });
      });

      document.querySelectorAll(".social-link").forEach((link) => {
        link.addEventListener("click", () => {
          console.log(data.feedback.socialClick, link.dataset.label);
        });
      });
    }

    function init() {
      renderProfile();
      renderSkills();
      renderProjects();
      renderSocials();
      bindInteractions();
    }

    init();
  </script>
</body>
</html>

[✓] 包含 4 个项目作品集占位卡片
[✓] 包含底部社交链接
[✓] 所有可编辑数据集中存放于 const data = {} 中

[✓] 手机与电脑端响应式布局
