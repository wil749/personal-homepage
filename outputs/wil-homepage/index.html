<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="王悦为 Lia wil · 智能医学工程（脑机接口方向）大一学生 · 艺术 × 神经科学" />
  <title>王悦为 · 个人主页</title>
  <style>
/* ============================================================
   WIL © homepage — 黑红白 · 编辑感 · 轻活泼
   V1 · 零依赖 · 纯前端 · 双语
   ============================================================ */

:root {
  /* 黑红白核心色板 */
  --black: #0b0b0d;
  --black-2: #141417;
  --black-3: #1d1d21;
  --white: #ffffff;
  --paper: #f4f0ea;
  --ink: #0b0b0d;
  --gray: #9b9ba3;
  --line: rgba(255, 255, 255, 0.14);
  --red: #ff2b2b;
  --red-2: #d51616;
  --red-glow: rgba(255, 43, 43, 0.35);

  /* 字体 */
  --font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC",
    system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono",
    "Consolas", monospace;

  /* 尺寸 */
  --radius-sm: 0.6rem;
  --radius-md: 1.1rem;
  --radius-round: 999px;
  --container: 74rem;
  --pad-x: clamp(1.2rem, 6vw, 4rem);
  --space: clamp(1.2rem, 4vw, 2.4rem);
  --section-y: clamp(3.4rem, 9vw, 6.5rem);

  /* 动效 */
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --dur: 0.42s;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 5.5rem;
}

body {
  margin: 0;
  background: var(--black);
  color: var(--white);
  font-family: var(--font-sans);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

h1, h2, h3, p { margin: 0; }

a { color: inherit; text-decoration: none; }

::selection {
  background: var(--red);
  color: var(--white);
}

img { max-width: 100%; }

/* ---------------- 背景装饰 ---------------- */
.bg-decor {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(42rem 42rem at 12% -8%, var(--red-glow), transparent 60%),
    radial-gradient(50rem 50rem at 92% 108%, rgba(255, 43, 43, 0.16), transparent 60%);
  opacity: 0.9;
}
.bg-grid {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 64px 64px;
  opacity: 0.5;
  -webkit-mask-image: radial-gradient(circle at 50% 30%, #000 0%, transparent 72%);
  mask-image: radial-gradient(circle at 50% 30%, #000 0%, transparent 72%);
}

/* ---------------- 定制光标（桌面） ---------------- */
.cursor-dot {
  position: fixed;
  top: 0; left: 0;
  width: 12px; height: 12px;
  z-index: 9999;
  border-radius: 50%;
  background: var(--red);
  mix-blend-mode: difference;
  pointer-events: none;
  transform: translate(-50%, -50%);
  transition: transform 0.12s var(--ease), opacity 0.2s ease;
  opacity: 0;
}
@media (hover: hover) and (pointer: fine) {
  .cursor-dot { opacity: 1; }
  body.has-cursor, body.has-cursor a, body.has-cursor button { cursor: none; }
}

/* ---------------- 顶部导航 ---------------- */
.nav {
  position: sticky;
  top: 0;
  z-index: 60;
  backdrop-filter: blur(10px);
  background: color-mix(in srgb, var(--black) 82%, transparent);
  border-bottom: 1px solid var(--line);
}
.nav__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  width: min(100% - var(--pad-x) * 2, var(--container));
  margin-inline: auto;
  padding-block: 0.85rem;
}
.brand {
  display: inline-flex;
  align-items: baseline;
  gap: 0.5rem;
  font-family: var(--font-mono);
  font-weight: 700;
  letter-spacing: 0.04em;
}
.brand b { color: var(--red); }
.brand .brand__dot {
  display: inline-block;
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--red);
  animation: pulse 2.4s var(--ease) infinite;
}
.nav__links {
  display: flex;
  align-items: center;
  gap: clamp(0.6rem, 2.5vw, 1.4rem);
}
.nav__links a {
  font-size: 0.92rem;
  color: var(--gray);
  font-weight: 600;
  letter-spacing: 0.02em;
  transition: color var(--dur) var(--ease);
}
.nav__links a:hover { color: var(--white); }
.lang {
  display: inline-flex;
  padding: 0.2rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-round);
  background: var(--black-2);
}
.lang button {
  padding: 0.28rem 0.7rem;
  border: 0;
  border-radius: var(--radius-round);
  background: transparent;
  color: var(--gray);
  font: inherit;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--dur) var(--ease);
}
.lang button.is-active {
  background: var(--red);
  color: var(--white);
}

/* ---------------- Hero ---------------- */
.hero {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  min-height: calc(100svh - 3.5rem);
  padding: clamp(3rem, 9vw, 6rem) var(--pad-x);
  align-items: center;
  justify-content: center;
  text-align: center;
}
.hero__eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.4rem 1rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-round);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gray);
}
.hero__eyebrow i {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--red);
  animation: pulse 2.2s var(--ease) infinite;
}
.hero__title {
  margin-block: 1.6rem 0.4rem;
  font-size: clamp(3rem, 13vw, 9.5rem);
  font-weight: 900;
  line-height: 0.92;
  letter-spacing: -0.03em;
  color: var(--white);
}
.hero__title .cn { display: block; }
.hero__title .gold {
  color: var(--red);
  font-style: italic;
  font-family: var(--font-sans);
}
.hero__alias {
  margin-top: 0.9rem;
  font-family: var(--font-mono);
  font-size: clamp(0.95rem, 3vw, 1.3rem);
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--gray);
}
.hero__alias b { color: var(--red); }
.hero__role {
  margin-top: 0.5rem;
  color: var(--gray);
  font-size: 0.92rem;
  letter-spacing: 0.04em;
}
.hero__intro {
  max-width: 40rem;
  margin: 1.8rem auto 0;
  font-size: clamp(1rem, 2.2vw, 1.22rem);
  color: var(--gray);
}
.hero__intro strong { color: var(--white); font-weight: 700; }
.hero__cta {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  margin-top: 2.2rem;
  padding: 0.85rem 1.6rem;
  border-radius: var(--radius-round);
  background: var(--white);
  color: var(--ink);
  font-weight: 800;
  letter-spacing: 0.02em;
  transition: transform var(--dur) var(--ease), background var(--dur) var(--ease);
}
.hero__cta:hover {
  background: var(--red);
  color: var(--white);
  transform: translateY(-3px) rotate(-1deg);
}
.hero__cta span { font-family: var(--font-mono); }
.scroll-hint {
  position: absolute;
  bottom: 1.4rem;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.3em;
  color: var(--gray);
  text-transform: uppercase;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
}
.scroll-hint::after {
  content: "";
  width: 1px; height: 2.4rem;
  background: linear-gradient(var(--red), transparent);
  animation: drip 1.8s var(--ease) infinite;
}

/* ---------------- 跑马灯 ---------------- */
.marquee {
  position: relative;
  z-index: 1;
  border-block: 1px solid var(--line);
  background: var(--red);
  overflow: hidden;
}
.marquee__track {
  display: flex;
  width: max-content;
  animation: marquee 26s linear infinite;
}
.marquee__group {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  padding-right: 1.5rem;
}
.marquee__group span {
  padding-right: 1.5rem;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: clamp(0.9rem, 2.4vw, 1.25rem);
  letter-spacing: 0.08em;
  color: #fff;
  text-transform: uppercase;
}
.marquee__group span::after {
  content: "✦";
  margin-left: 1.5rem;
  color: rgba(255, 255, 255, 0.75);
}
.marquee--reverse .marquee__track { animation-direction: reverse; }

/* ---------------- 通用 Section ---------------- */
.section {
  position: relative;
  z-index: 1;
  width: min(100% - var(--pad-x) * 2, var(--container));
  margin-inline: auto;
  padding-block: var(--section-y);
}
.section__head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1.5rem;
  flex-wrap: wrap;
  margin-bottom: var(--space);
}
.section__head h2 {
  font-size: clamp(1.9rem, 5vw, 3.2rem);
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 1.05;
}
.section__head h2 em {
  font-style: normal;
  color: var(--red);
}
.section__tag {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gray);
}
.section__sub {
  max-width: 32rem;
  color: var(--gray);
  font-size: 0.98rem;
}

/* ---------------- About 卡片 ---------------- */
.about-grid {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: var(--space);
  align-items: stretch;
}
.long-intro {
  position: relative;
  padding: var(--space);
  border-radius: var(--radius-md);
  background: linear-gradient(145deg, var(--black-2), var(--black-3));
  border: 1px solid var(--line);
  overflow: hidden;
}
.long-intro::before {
  content: "“";
  position: absolute;
  top: -1.5rem; left: 1rem;
  font-size: 9rem;
  font-weight: 900;
  color: var(--red);
  opacity: 0.22;
  line-height: 1;
}
.long-intro p {
  position: relative;
  font-size: clamp(1.1rem, 2.6vw, 1.4rem);
  line-height: 1.6;
  color: var(--white);
}
.long-intro p strong { color: var(--red); }
.long-intro__meta {
  display: flex;
  gap: 0.8rem;
  flex-wrap: wrap;
  margin-top: 1.4rem;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.35rem 0.8rem;
  border-radius: var(--radius-round);
  border: 1px solid var(--line);
  font-size: 0.82rem;
  color: var(--gray);
}
.chip i { color: var(--red); font-style: normal; }
.chip--red {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
  font-family: var(--font-mono);
  font-weight: 800;
}

.fact-card {
  display: flex;
  flex-direction: column;
  gap: 0;
  padding: var(--space);
  border-radius: var(--radius-md);
  background: var(--paper);
  color: var(--ink);
  border: 1px solid transparent;
}
.fact-card__title {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--red-2);
  margin-bottom: 1.1rem;
}
.fact-list { display: flex; flex-direction: column; }
.fact-row {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  padding-block: 0.7rem;
  border-bottom: 1px dashed rgba(0, 0, 0, 0.18);
}
.fact-row:last-child { border-bottom: 0; }
.fact-row dt {
  color: rgba(0, 0, 0, 0.55);
  font-size: 0.86rem;
  flex-shrink: 0;
}
.fact-row dd {
  margin: 0;
  font-weight: 700;
  text-align: right;
  font-size: 0.95rem;
}

/* ---------------- 兴趣云 ---------------- */
.hobbies {
  display: flex;
  flex-wrap: wrap;
  gap: 0.9rem;
  justify-content: center;
  padding-top: var(--space);
}
.hobby {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.8rem 1.3rem;
  border-radius: var(--radius-round);
  background: var(--black-2);
  border: 1px solid var(--line);
  font-size: clamp(1rem, 2.2vw, 1.25rem);
  font-weight: 700;
  transition: transform var(--dur) var(--ease), background var(--dur) var(--ease),
    color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.hobby .en {
  font-family: var(--font-mono);
  font-size: 0.62em;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gray);
  font-weight: 600;
}
.hobby:nth-child(odd) { transform: rotate(-1.6deg); }
.hobby:nth-child(even) { transform: rotate(1.4deg); }
.hobby:hover {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
  transform: rotate(0deg) translateY(-4px) scale(1.04);
}
.hobby:hover .en { color: rgba(255, 255, 255, 0.85); }

/* ---------------- 生长中（空段） ---------------- */
.growing {
  position: relative;
  display: grid;
  gap: var(--space);
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
}
.grow-card {
  padding: var(--space);
  border-radius: var(--radius-md);
  border: 1px dashed var(--line);
  background: var(--black-2);
  transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.grow-card:hover {
  border-color: var(--red);
  transform: translateY(-4px);
}
.grow-card__no {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.18em;
  color: var(--red);
  text-transform: uppercase;
}
.grow-card h3 {
  margin: 0.9rem 0 0.4rem;
  font-size: 1.5rem;
  font-weight: 900;
}
.grow-card p { color: var(--gray); font-size: 0.94rem; }
.grow-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  margin-top: 1rem;
  padding: 0.3rem 0.8rem;
  border-radius: var(--radius-round);
  background: color-mix(in srgb, var(--red) 14%, transparent);
  color: var(--red);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.1em;
}
.grow-badge i {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--red);
  animation: pulse 2s var(--ease) infinite;
}

/* ---------------- 联系 ---------------- */
.contact {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space);
}
.contact-item {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  padding: var(--space);
  border-radius: var(--radius-md);
  background: var(--black-2);
  border: 1px solid var(--line);
  overflow: hidden;
  transition: transform var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.contact-item::after {
  content: "→";
  position: absolute;
  right: -0.4rem; bottom: -1.4rem;
  font-size: 6rem;
  font-weight: 900;
  color: var(--red);
  opacity: 0.12;
  transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
}
.contact-item:hover {
  border-color: var(--red);
  transform: translateY(-4px);
}
.contact-item:hover::after {
  transform: translate(-0.4rem, -0.4rem);
  opacity: 0.3;
}
.contact-item__k {
  font-family: var(--font-mono);
  font-size: 0.74rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--red);
}
.contact-item__v {
  font-weight: 800;
  font-size: clamp(1rem, 2.4vw, 1.3rem);
  word-break: break-all;
}
.contact-item__tap {
  margin-top: 0.4rem;
  font-size: 0.8rem;
  color: var(--gray);
}

/* ---------------- 页脚 ---------------- */
.footer {
  position: relative;
  z-index: 1;
  border-top: 1px solid var(--line);
  margin-top: var(--section-y);
  padding: var(--space) var(--pad-x) 2.4rem;
}
.footer__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
  width: min(100%, var(--container));
  margin-inline: auto;
}
.footer p { color: var(--gray); font-size: 0.86rem; }
.footer .mono { font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.08em; }
.footer b { color: var(--red); }
.social-quick {
  display: flex;
  gap: 0.8rem;
  flex-wrap: wrap;
}
.social-quick a {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--gray);
  border-bottom: 1px solid var(--line);
  transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.social-quick a:hover { color: var(--white); border-color: var(--red); }

/* ---------------- 滚动浮现 ---------------- */
.reveal {
  opacity: 0;
  transform: translateY(26px);
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.reveal.is-in { opacity: 1; transform: none; }

/* ---------------- 动画 ---------------- */
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.45); opacity: 0.5; }
}
@keyframes drip {
  0% { transform: scaleY(0); transform-origin: top; }
  45% { transform: scaleY(1); transform-origin: top; }
  55% { transform: scaleY(1); transform-origin: bottom; }
  100% { transform: scaleY(0); transform-origin: bottom; }
}
@keyframes marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* ---------------- 响应式 ---------------- */
@media (max-width: 820px) {
  .about-grid { grid-template-columns: 1fr; }
  .contact { grid-template-columns: 1fr; }
  .nav__links a:not(.lang a) { display: none; }
  .scroll-hint { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .marquee__track, .brand .brand__dot, .scroll-hint::after,
  .cursor-dot, .grow-badge i, .hero__eyebrow i,
  .hobby, .hobby:nth-child(odd), .hobby:nth-child(even) {
    animation: none !important;
    transition: none !important;
    transform: none !important;
  }
  .reveal { opacity: 1; transform: none; }
}

</style>
</head>
<body>
  <!-- 背景装饰 -->
  <div class="bg-decor" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>
  <div id="cursor" class="cursor-dot" aria-hidden="true"></div>

  <!-- 顶部导航 -->
  <header class="nav">
    <div class="nav__inner">
      <a class="brand" href="#top">
        <b>W</b>IL<span class="brand__dot" aria-hidden="true"></span><span id="brand-name">wil</span>
      </a>
      <nav class="nav__links" aria-label="导航">
        <a id="nav-about" href="#about">关于</a>
        <a id="nav-hobbies" href="#hobbies">兴趣</a>
        <a id="nav-growing" href="#growing">进行中</a>
        <a id="nav-contact" href="#contact">联系</a>
        <div class="lang" role="group" aria-label="语言切换">
          <button type="button" data-lang="zh" class="is-active">中</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero" id="top">
    <span class="hero__eyebrow"><i></i><span id="eyebrow">艺术 × 神经科学</span></span>
    <h1 class="hero__title">
      <span class="cn" id="name-cn">王悦为</span>
    </h1>
    <p class="hero__alias" id="alias">LIA · WIL</p>
    <p class="hero__role" id="role"></p>
    <p class="hero__intro" id="intro"></p>
    <a class="hero__cta" href="#contact"><span id="cta">认识我一下</span> →</a>
    <div class="scroll-hint" aria-hidden="true">Scroll · 下滑</div>
  </section>

  <!-- 跑马灯 -->
  <div class="marquee" aria-hidden="true">
    <div class="marquee__track" id="marquee-track"></div>
  </div>
  <div class="marquee marquee--reverse" aria-hidden="true">
    <div class="marquee__track" id="marquee-track-2"></div>
  </div>

  <main>
    <!-- 关于 -->
    <section class="section" id="about">
      <div class="section__head reveal">

  /* ---------- 语言切换 ---------- */
  function bindLang() {
    document.querySelectorAll(".lang button").forEach((b) => {
      b.addEventListener("click", () => {
        if (b.dataset.lang !== lang) {
          lang = b.dataset.lang;
          render();
        }
      });
    });
  }

  /* ---------- 滚动浮现 ---------- */
  let io = null;
  function observeAll() {
    if (io) io.disconnect();
    io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            e.target.classList.add("is-in");
            io.unobserve(e.target);
          }
        });
      },
      { threshold: 0.12 }
    );
    document.querySelectorAll(".reveal").forEach((el) => io.observe(el));
  }

  /* ---------- 定制光标 ---------- */
  function bindCursor() {
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
    const dot = $("#cursor");
    document.body.classList.add("has-cursor");
    window.addEventListener("mousemove", (e) => {
      dot.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`;
    });
  }

  /* ---------- 初始化 ---------- */
  function init() {
    render();
    bindLang();
    bindCursor();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
