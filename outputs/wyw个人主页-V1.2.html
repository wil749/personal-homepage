<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="王悦为 Lia wil · 智能医学工程（脑机接口方向）大一学生 · 黑红金 撞色档案" />
  <title>王悦为 · WIL</title>

  <!-- 纯自定义样式，无外部依赖，彻底离线自包含 -->
  <style>
    :root {
      --ink: #000000;        /* 漆黑夜 */
      --red: #e30613;        /* 高纯度红 */
      --red-deep: #a30d14;   /* 深红 */
      --gold: #c9a227;       /* 陈旧金 */
      --gold-soft: #e6c877;  /* 柔金 */
      --white: #ffffff;      /* 纯白 */
      --soft: #ece7dd;       /* 米白 */
      --gray: #b9b9c2;
      --font: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --wrap: 76rem;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 4.6rem; }
    body { margin: 0; background: var(--ink); color: var(--white); font-family: var(--font); line-height: 1.7; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    ::selection { background: var(--red); color: #fff; }
    a { color: inherit; text-decoration: none; }
    button { font-family: var(--font); }
    h1,h2,h3,p { margin: 0; }
    .wrap { width: min(100% - clamp(1.2rem, 6vw, 4rem) * 2, var(--wrap)); margin-inline: auto; }

    /* ---------------- 顶部栏（黑） ---------------- */
    .topbar { position: sticky; top: 0; z-index: 80; background: var(--ink); border-bottom: 2px solid var(--red); }
    .topbar__inner { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: 0.8rem; }
    .brand { display: inline-flex; align-items: center; gap: 0.55rem; font-weight: 900; letter-spacing: 0.04em; }
    .brand svg { width: 1.5rem; height: 1.5rem; color: var(--red); }
    .brand b { color: var(--white); }
    .brand .sub { font-size: 0.66rem; letter-spacing: 0.22em; color: var(--gold); font-weight: 700; }
    .topnav { display: flex; align-items: center; gap: clamp(0.8rem, 3vw, 1.6rem); }
    .topnav a { font-size: 0.84rem; letter-spacing: 0.08em; color: var(--white); opacity: 0.72; font-weight: 700; transition: color .3s var(--ease), opacity .3s var(--ease); }
    .topnav a:hover { color: var(--red); opacity: 1; }
    .lang { display: inline-flex; padding: 0.16rem; border: 1px solid #333; border-radius: 2px; }
    .lang button { padding: 0.24rem 0.62rem; border: 0; background: transparent; color: var(--white); font-size: 0.72rem; font-weight: 800; letter-spacing: .06em; cursor: pointer; transition: all .3s var(--ease); }
    .lang button.is-active { background: var(--red); color: #fff; }

    /* ---------------- 色带通用 ---------------- */
    .band { position: relative; overflow: hidden; }
    .band--red { background: var(--red); color: var(--ink); }
    .band--black { background: var(--ink); color: var(--white); }
    .halftone { position: absolute; inset: 0; pointer-events: none; opacity: 0.28; background-image: radial-gradient(rgba(0,0,0,0.22) 1.3px, transparent 1.4px); background-size: 9px 9px; }
    .label { display: inline-flex; align-items: center; gap: 0.6rem; font-size: 0.74rem; font-weight: 800; letter-spacing: 0.3em; text-transform: uppercase; }
    .label::before { content: ""; width: 1.6rem; height: 3px; background: currentColor; }
    .band--red .label { color: var(--ink); }
    .band--black .label { color: var(--gold); }

    /* ---------------- 封面（红 · 大片撞色） ---------------- */
    .cover { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: clamp(3rem, 10vw, 6rem) clamp(1.2rem, 6vw, 4rem); }
    .cover .eyebrow { font-size: 0.72rem; font-weight: 900; letter-spacing: 0.36em; text-transform: uppercase; color: var(--ink); }
    .cover__name { font-size: clamp(3.6rem, 17vw, 11rem); font-weight: 900; line-height: 0.92; letter-spacing: -0.03em; color: var(--ink); margin-top: 0.6rem; }
    .cover__name .en { color: #fff; display: inline-block; }
    .cover__alias { margin-top: 0.8rem; font-size: clamp(0.8rem, 2.6vw, 1.05rem); font-weight: 800; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold-soft); }
    .cover__rule { width: 7rem; height: 5px; margin: 1.5rem auto; background: var(--ink); }
    .cover__role { font-size: clamp(0.92rem, 2.4vw, 1.08rem); font-weight: 700; color: var(--ink); letter-spacing: 0.04em; }
    .cover__intro { max-width: 40rem; margin: 1.2rem auto 0; font-size: clamp(1rem, 2.2vw, 1.16rem); color: rgba(0,0,0,0.82); }
    .cover__intro strong { color: var(--ink); background: #fff; padding: 0 0.25rem; }
    .cover__cta { display: inline-flex; align-items: center; gap: 0.6rem; margin-top: 2rem; padding: 0.85rem 1.8rem; background: var(--ink); color: #fff; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.9rem; transition: transform .35s var(--ease), background .35s var(--ease), color .35s var(--ease); }
    .cover__cta:hover { background: #fff; color: var(--red); transform: translateY(-3px); }

    /* 装饰插画 */
    .art { position: absolute; pointer-events: none; z-index: 1; }
    .art--cat { left: clamp(1rem, 6vw, 4rem); bottom: 12%; width: clamp(5rem, 13vw, 9rem); color: #000; }
    .art--brain { right: clamp(1rem, 7vw, 5rem); top: 16%; width: clamp(4.5rem, 12vw, 8rem); color: #000; }
    .art--brush { right: clamp(1rem, 10vw, 7rem); bottom: 18%; width: clamp(4rem, 10vw, 7rem); color: var(--gold-soft); transform: rotate(-18deg); }

    .scroll-hint { position: absolute; bottom: 1.4rem; left: 50%; transform: translateX(-50%); font-size: 0.66rem; font-weight: 800; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink); opacity: 0.7; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
    .scroll-hint::after { content: ""; width: 2px; height: 2rem; background: linear-gradient(var(--ink), transparent); animation: drip 2s var(--ease) infinite; }

    /* ---------------- 章节 ---------------- */
    .section { padding-block: clamp(3.2rem, 9vw, 6rem); position: relative; }
    .section__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1.2rem; flex-wrap: wrap; margin-bottom: clamp(1.8rem, 4vw, 2.8rem); }
    .h2 { font-size: clamp(2rem, 7vw, 4.2rem); font-weight: 900; letter-spacing: -0.02em; line-height: 1; margin-top: 0.7rem; }
    .h2 em { font-style: normal; color: var(--red); }
    .band--black .h2 { color: #fff; }
    .h2 .gold { color: var(--gold); }
    .section__sub { max-width: 30rem; color: var(--gray); font-size: 0.96rem; }

    /* 关于（黑） */
    .about-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(1rem, 3vw, 2rem); align-items: stretch; }
    .long-intro { font-size: clamp(1.15rem, 3vw, 1.6rem); line-height: 1.6; color: var(--white); font-weight: 500; }
    .long-intro em { font-style: normal; color: var(--gold); }
    .about-meta { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1.6rem; }
    .chip { padding: 0.3rem 0.7rem; border: 1px solid #333; color: var(--gray); font-size: 0.8rem; font-weight: 700; }
    .chip b { color: var(--red); font-weight: 800; }
    /* 档案红卡 */
    .fact-card { background: var(--red); color: #fff; padding: clamp(1.4rem, 3.5vw, 2.2rem); position: relative; }
    .fact-card__title { display: inline-flex; align-items: baseline; gap: 0.6rem; font-weight: 900; letter-spacing: 0.14em; font-size: 1rem; color: #fff; }
    .fact-card__title i { font-style: normal; color: var(--gold-soft); }
    .fact-list { display: flex; flex-direction: column; margin-top: 1rem; }
    .fact-row { display: flex; justify-content: space-between; gap: 1rem; padding-block: 0.7rem; border-bottom: 1px solid rgba(255,255,255,0.28); }
    .fact-row:last-child { border-bottom: 0; }
    .fact-row dt { color: rgba(255,255,255,0.72); font-size: 0.82rem; flex-shrink: 0; }
    .fact-row dd { margin: 0; font-weight: 800; text-align: right; font-size: 0.92rem; }

    /* ---------------- 兴趣（红） ---------------- */
    .hobbies { display: grid; grid-template-columns: repeat(5, 1fr); gap: clamp(0.8rem, 2vw, 1.3rem); }
    .hobby { position: relative; background: #fff; color: var(--ink); padding: clamp(1.1rem, 2.6vw, 2rem) 1rem; text-align: left; border: 0; cursor: pointer; display: flex; flex-direction: column; gap: 1rem; transition: transform .35s var(--ease), box-shadow .35s var(--ease), background .35s var(--ease); }
    .hobby:hover { transform: translateY(-6px); box-shadow: 0 14px 30px rgba(0,0,0,0.28); }
    .hobby svg { width: clamp(2rem, 4vw, 3rem); height: clamp(2rem, 4vw, 3rem); color: var(--red); }
    .hobby .cn { font-weight: 900; font-size: clamp(1.1rem, 2.4vw, 1.5rem); }
    .hobby .en { font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray); font-weight: 800; }
    .hobby::before { content: ""; position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: var(--red); }
    .hobby:nth-child(2)::before { background: var(--gold); }

    /* ---------------- 项目（黑） ---------------- */
    .growing { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(1rem, 3vw, 2rem); }
    .grow-card { border: 1px solid #2c2c2c; padding: clamp(1.4rem, 3.5vw, 2.2rem); position: relative; transition: border-color .35s var(--ease), transform .35s var(--ease); }
    .grow-card:hover { border-color: var(--red); transform: translateY(-6px); }
    .grow-card__no { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.24em; color: var(--gold); }
    .grow-card h3 { margin: 0.7rem 0 0.5rem; font-size: clamp(1.2rem, 2.6vw, 1.5rem); font-weight: 900; color: #fff; }
    .grow-card p { color: var(--gray); font-size: 0.94rem; }
    .grow-badge { display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 1rem; color: var(--red); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
    .grow-badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: pulse 2s var(--ease) infinite; }

    /* ---------------- 联系（红） ---------------- */
    .contact { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(1rem, 3vw, 2rem); }
    .contact-item { background: var(--ink); color: #fff; padding: clamp(1.4rem, 3.5vw, 2.2rem); display: flex; flex-direction: column; gap: 0.5rem; position: relative; transition: transform .35s var(--ease), background .35s var(--ease); }
    .contact-item:hover { transform: translateY(-6px); background: #1a1a1a; }
    .contact-item__k { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-soft); }
    .contact-item__v { font-weight: 900; font-size: clamp(1.05rem, 2.6vw, 1.4rem); word-break: break-all; }
    .contact-item__tap { margin-top: 0.4rem; font-size: 0.8rem; color: var(--gray); }
    .contact-item__tap::after { content: "→"; margin-left: 0.4rem; color: var(--red); }

    /* ---------------- 页脚（黑） ---------------- */
    .footer { background: var(--ink); border-top: 2px solid var(--red); padding-block: clamp(1.8rem, 4vw, 2.6rem); }
    .footer__inner { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .footer p { color: var(--gray); font-size: 0.86rem; }
    .footer .mono { font-family: var(--font); font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
    .footer b { color: var(--red); }

    /* ---------------- 滚动浮现 ---------------- */
    [data-reveal] { opacity: 0; transform: translateY(22px); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }
    [data-reveal].is-in { opacity: 1; transform: none; }
    .fade { opacity: 0; }
    .fade.on { animation: pop 0.6s var(--ease) both; }

    @keyframes pop { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes drip { 0% { transform: scaleY(0); transform-origin: top; } 45% { transform: scaleY(1); transform-origin: top; } 55% { transform: scaleY(1); transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(var(--r,0deg)); } 50% { transform: translateY(-12px) rotate(var(--r,0deg)); } }

    /* ---------------- 响应式 ---------------- */
    @media (max-width: 860px) {
      .topnav > a { display: none; }
      .about-grid { grid-template-columns: 1fr; }
      .hobbies { grid-template-columns: repeat(2, 1fr); }
      .growing, .contact { grid-template-columns: 1fr; }
      .art--brain { display: none; }
      .scroll-hint { display: none; }
    }
    @media (max-width: 480px) { .hobbies { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      [data-reveal], .fade.on, .scroll-hint::after, .grow-badge i, .art { animation: none !important; transition: none !important; }
      [data-reveal] { opacity: 1; transform: none; }
    }
  </style>
</head>

    let lang = "zh";
    const $ = (s) => document.querySelector(s);

    function render() {
      const t = COPY[lang];
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.title = `${t.nameCn} · WIL`;
      $("#brand-name").textContent = t.nameCn;
      $("#eyebrow").textContent = t.eyebrow;
      $("#name-cn").textContent = t.nameCn;
      $("#name-en").textContent = t.nameEn;
      $("#alias").textContent = t.alias;
      $("#role").textContent = t.role;
      $("#intro").innerHTML = t.intro;
      $("#cta").textContent = t.cta;

      $("#nav-about").textContent = t.nav.about;
      $("#nav-hobbies").textContent = t.nav.hobbies;
      $("#nav-growing").textContent = t.nav.growing;
      $("#nav-contact").textContent = t.nav.contact;

      $("#about-tag").textContent = t.aboutTag;
      $("#about-h2").innerHTML = t.aboutH2;
      $("#about-sub").textContent = t.aboutSub;
      $("#long-intro").innerHTML = t.longIntro;
      $("#about-meta").innerHTML = t.aboutMeta.map((m, i) => `<span class="chip"><b>${String(i + 1).padStart(2, "0")}</b>${m}</span>`).join("");
      $("#fact-title").textContent = t.factTitle;
      $("#fact-list").innerHTML = t.facts.map((f) => `<div class="fact-row"><dt>${f.k}</dt><dd>${f.v}</dd></div>`).join("");

      $("#hobbies-tag").textContent = t.hobbiesTag;
      $("#hobbies-h2").innerHTML = t.hobbiesH2;
      $("#hobbies-sub").textContent = t.hobbiesSub;
      $("#hobbies").innerHTML = t.hobbies.map((h) => `
        <button class="hobby" type="button" data-reveal>
          ${ICON[h.icon]}
          <span class="en">${h.en}</span>
          <span class="cn">${h.cn}</span>
        </button>`).join("");

      $("#growing-tag").textContent = t.growingTag;
      $("#growing-h2").innerHTML = t.growingH2;
      $("#growing-sub").textContent = t.growingSub;
      $("#growing").innerHTML = t.growing.map((g) => `
        <article class="grow-card" data-reveal>
          <div class="grow-card__no">CASE ${g.no}</div>
          <h3>${g.title}</h3>
          <p>${g.desc}</p>
          <span class="grow-badge"><i></i>${g.badge}</span>
        </article>`).join("");

      $("#contact-tag").textContent = t.contactTag;
      $("#contact-h2").innerHTML = t.contactH2;
      $("#contact-sub").textContent = t.contactSub;
      $("#contact").innerHTML = t.contact.map((c) => `
        <a class="contact-item" href="${c.href}" target="${c.href.startsWith("http") ? "_blank" : "_self"}" data-reveal>
          <span class="contact-item__k">${c.k}</span>
          <span class="contact-item__v">${c.v}</span>
          <span class="contact-item__tap">${c.tap}</span>
        </a>`).join("");

      $("#footer").textContent = t.footer;
      $("#footer-note").textContent = t.footerNote;

      document.querySelectorAll(".lang button").forEach((b) => b.classList.toggle("is-active", b.dataset.lang === lang));
      observe();
    }

    /* ---------- 滚动浮现 ---------- */
    let io = null;
    function observe() {
      if (io) io.disconnect();
      io = new IntersectionObserver((es) => {
        es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("is-in"); io.unobserve(e.target); } });
      }, { threshold: 0.14 });
      document.querySelectorAll("[data-reveal]").forEach((el) => io.observe(el));
    }

    function bindLang() {
      document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
        if (b.dataset.lang !== lang) { lang = b.dataset.lang; render(); }
      }));
    }

    function init() {
      render();
      bindLang();
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  })();
  </script>
